name: 'Terraform Apply'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.7.4'
      terraform_folder:
        description: 'Terraform folder path'
        required: false
        type: string
        default: 'terraform/project-backend'

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_CLI: false
  TF_LOG: info

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set subscription ID
        run: |
          cd ${{ inputs.terraform_folder }}
          SUBSCRIPTION_ID=$(grep subscription_id ../environments/${{ inputs.environment }}/terraform.tfvars | cut -d'"' -f2 || echo "${{ secrets.AZURE_SUBSCRIPTION_ID }}")
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV

      - name: Terraform Init
        id: init
        run: |
          cd ${{ inputs.terraform_folder }}
          terraform init \
            -backend-config=../environments/${{ inputs.environment }}/backend.tfvars \
            -reconfigure

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.terraform_folder }}
      
      - name: Terraform Apply
        id: apply
        run: |
          cd ${{ inputs.terraform_folder }}
          terraform apply -auto-approve tfplan

      - name: Send Deployment Notifications
        if: always()
        uses: ./.github/actions/notifications/send-teams-alert.yml
        with:
          environment: ${{ inputs.environment }}
          status: ${{ job.status }}
          deployment: true